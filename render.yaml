# The game server on Render. The web page is hosted separately; see docs/deployment.md.
services:
  - type: web
    name: omi-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @omi/server start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      # Render's proxy sits in front of the server, so client addresses come
      # from X-Forwarded-For. Without this every player counts as one address.
      - key: TRUST_PROXY
        value: 'true'
      # The address of the web page, set in the dashboard once it is known.
      - key: CORS_ORIGINS
        sync: false
