<x-dc>
<helmet>

</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0E4A41; color: #FFFFFF; font-family: 'Manrope', 'Noto Sans Sinhala', 'Segoe UI', sans-serif">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 18px 10px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 38px; font-size: 13px; font-weight: 700">Us</span>
        <div style="width: 110px; height: 6px; border-radius: 999px; background: #0A3832; display: flex" aria-label="4 of 10 tokens">
          <div style="width: 40%; border-radius: 999px; background: #FFFFFF"></div>
        </div>
        <span style="font-size: 15px; font-weight: 800">4</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 38px; font-size: 13px; font-weight: 700; color: #C4E3DC">Them</span>
        <div style="width: 110px; height: 6px; border-radius: 999px; background: #0A3832; display: flex" aria-label="6 of 10 tokens">
          <div style="width: 60%; border-radius: 999px; background: #FFB199"></div>
        </div>
        <span style="font-size: 15px; font-weight: 800; color: #FFD9CC">6</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; padding: 8px 14px; border-radius: 999px; background: #0A3832; color: #C4E3DC; font-size: 12px; font-weight: 700">Round 5 · no trump yet</div>
  </header>

  <main style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: auto minmax(0, 1fr); align-items: center; justify-items: center; gap: 8px; padding: 10px 14px 18px">
    <span></span>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #10201D; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800">N</span>
      <span style="font-size: 13px; font-weight: 700">Nimal</span>
      <span style="font-size: 11px; font-weight: 600; color: #C4E3DC">partner · 4 cards</span>
    </div>
    <span></span>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #10201D; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800">K</span>
      <span style="font-size: 13px; font-weight: 700">Kamala</span>
      <span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #0A3832; color: #C4E3DC">dealer</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #C4E3DC">Waiting for</span>
      <span style="font-size: 20px; font-weight: 800; line-height: 1.15">your call</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #10201D; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800">S</span>
      <span style="font-size: 13px; font-weight: 700">Sunil</span>
      <span style="font-size: 11px; font-weight: 600; color: #C4E3DC">4 cards</span>
    </div>
  </main>

  <footer style="display: flex; flex-direction: column; gap: 16px; padding: 20px 16px 24px; background: #FFFFFF; color: #10201D; border-radius: 30px 30px 0 0">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <h2 style="margin: 0; font-size: 20px; font-weight: 800; line-height: 1.1">Name trump</h2>
        <span style="font-size: 13px; font-weight: 500; color: #51635F">Your other 4 cards come after you call</span>
      </div>
      <div style="width: 64px; height: 8px; border-radius: 999px; background: #E4ECEA; display: flex" aria-hidden="true">
        <div style="width: 80%; border-radius: 999px; background: #D63A25"></div>
      </div>
      <span style="font-size: 15px; font-weight: 800; color: #B32C1A" aria-label="12 seconds left">0:12</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="height: 60px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 2px solid #10201D; border-radius: 16px; background: #FFFFFF; color: #D63A25; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21C5 15 2 11.5 2 7.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 10 1.8C22 11.5 19 15 12 21Z"/></svg>
        <span style="color: #10201D">Hearts</span>
      </button>
      <button style="height: 60px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 2px solid #10201D; border-radius: 16px; background: #FFFFFF; color: #10201D; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C8 7 3 10 3 14.5A4.5 4.5 0 0 0 11 17.4L9.5 22h5L13 17.4A4.5 4.5 0 0 0 21 14.5C21 10 16 7 12 2Z"/></svg>
        Spades
      </button>
      <button style="height: 60px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 2px solid #10201D; border-radius: 16px; background: #FFFFFF; color: #D63A25; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 20 12 12 22 4 12Z"/></svg>
        <span style="color: #10201D">Diamonds</span>
      </button>
      <button style="height: 60px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 2px solid #10201D; border-radius: 16px; background: #FFFFFF; color: #10201D; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="7" r="4.2"/><circle cx="6.5" cy="14" r="4.2"/><circle cx="17.5" cy="14" r="4.2"/><path d="M10 22h4l-1.2-6h-1.6Z"/></svg>
        Clubs
      </button>
    </div>

    <div style="display: flex; justify-content: center; gap: 10px; padding: 4px 0 0">
      <div aria-label="Ace of hearts" style="width: 62px; height: 90px; box-sizing: border-box; padding: 7px; border-radius: 10px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 3px 3px 0 #10201D; display: flex; flex-direction: column; justify-content: space-between; color: #D63A25">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 30px; font-weight: 800; line-height: 0.9">A</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 21C5 15 2 11.5 2 7.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 10 1.8C22 11.5 19 15 12 21Z"/></svg>
      </div>
      <div aria-label="Ten of hearts" style="width: 62px; height: 90px; box-sizing: border-box; padding: 7px; border-radius: 10px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 3px 3px 0 #10201D; display: flex; flex-direction: column; justify-content: space-between; color: #D63A25">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 30px; font-weight: 800; line-height: 0.9">10</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 21C5 15 2 11.5 2 7.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 10 1.8C22 11.5 19 15 12 21Z"/></svg>
      </div>
      <div aria-label="Queen of spades" style="width: 62px; height: 90px; box-sizing: border-box; padding: 7px; border-radius: 10px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 3px 3px 0 #10201D; display: flex; flex-direction: column; justify-content: space-between; color: #10201D">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 30px; font-weight: 800; line-height: 0.9">Q</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 2C8 7 3 10 3 14.5A4.5 4.5 0 0 0 11 17.4L9.5 22h5L13 17.4A4.5 4.5 0 0 0 21 14.5C21 10 16 7 12 2Z"/></svg>
      </div>
      <div aria-label="Eight of clubs" style="width: 62px; height: 90px; box-sizing: border-box; padding: 7px; border-radius: 10px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 3px 3px 0 #10201D; display: flex; flex-direction: column; justify-content: space-between; color: #10201D">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 30px; font-weight: 800; line-height: 0.9">8</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><circle cx="12" cy="7" r="4.2"/><circle cx="6.5" cy="14" r="4.2"/><circle cx="17.5" cy="14" r="4.2"/><path d="M10 22h4l-1.2-6h-1.6Z"/></svg>
      </div>
    </div>

    <p style="margin: 0; text-align: center; font-size: 12px; font-weight: 500; color: #51635F">If time runs out, the suit you hold most of is called.</p>
  </footer>
</div>
