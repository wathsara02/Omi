<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Omi table on desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#0C5A4F}a:hover{color:#083C35}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; display: flex; flex-wrap: wrap; background: #0E4A41; color: #FFFFFF; font-family: 'Manrope', 'Noto Sans Sinhala', 'Segoe UI', sans-serif">

  <section style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; padding: 28px 32px 36px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
      <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #C4E3DC">Room KXT4P9 · Round 5</span>
      <div style="display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; background: #FFB199; color: #10201D">
        <span style="font-size: 13px; font-weight: 800">Trump</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-label="spades"><path d="M12 2C8 7 3 10 3 14.5A4.5 4.5 0 0 0 11 17.4L9.5 22h5L13 17.4A4.5 4.5 0 0 0 21 14.5C21 10 16 7 12 2Z"/></svg>
      </div>
    </div>

    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: auto repeat(3, minmax(124px, 1fr)); align-items: center; justify-items: center; gap: 8px">
      <span></span>
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 52px; height: 52px; border-radius: 50%; background: #FFFFFF; color: #10201D; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800">N</span>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 700">Nimal</span>
          <span style="font-size: 13px; font-weight: 600; color: #C4E3DC">partner · 5 cards</span>
        </div>
      </div>
      <span></span>

      <span></span>
      <div aria-label="King of hearts, played by Nimal" style="width: 76px; height: 108px; box-sizing: border-box; padding: 9px; border-radius: 12px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 4px 4px 0 #06302A; display: flex; flex-direction: column; justify-content: space-between; color: #D63A25; transform: rotate(-3deg)">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 36px; font-weight: 800; line-height: 0.9">K</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 21C5 15 2 11.5 2 7.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 10 1.8C22 11.5 19 15 12 21Z"/></svg>
      </div>
      <span></span>

      <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap; justify-content: center">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span style="width: 52px; height: 52px; border-radius: 50%; background: #FFFFFF; color: #10201D; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800">K</span>
          <span style="font-size: 16px; font-weight: 700">Kamala</span>
          <span style="font-size: 13px; font-weight: 600; color: #C4E3DC">5 cards</span>
        </div>
        <div aria-label="Jack of hearts, played by Kamala" style="width: 76px; height: 108px; box-sizing: border-box; padding: 9px; border-radius: 12px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 4px 4px 0 #06302A; display: flex; flex-direction: column; justify-content: space-between; color: #D63A25; transform: rotate(4deg)">
          <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 36px; font-weight: 800; line-height: 0.9">J</span>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 21C5 15 2 11.5 2 7.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 10 1.8C22 11.5 19 15 12 21Z"/></svg>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #C4E3DC">Tricks</span>
        <span style="font-size: 36px; font-weight: 800; line-height: 1">2 – 1</span>
      </div>
      <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap; justify-content: center">
        <div aria-label="Nine of hearts, led by Sunil" style="width: 76px; height: 108px; box-sizing: border-box; padding: 9px; border-radius: 12px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 4px 4px 0 #06302A; display: flex; flex-direction: column; justify-content: space-between; color: #D63A25; transform: rotate(-5deg)">
          <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 36px; font-weight: 800; line-height: 0.9">9</span>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 21C5 15 2 11.5 2 7.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 10 1.8C22 11.5 19 15 12 21Z"/></svg>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; background: #0A3832; color: #C4E3DC; border: 2px dashed #C4E3DC; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800">S</span>
          <span style="font-size: 16px; font-weight: 700">Sunil</span>
          <span style="font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #0A3832; color: #FFD9CC">away 0:41</span>
        </div>
      </div>

      <span></span>
      <div style="width: 76px; height: 108px; box-sizing: border-box; border-radius: 12px; border: 2px dashed #FFB199; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 13px; font-weight: 700; line-height: 1.25; color: #FFD9CC">Your card</div>
      <span></span>
    </div>

    <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 16px 0 0">
      <button aria-label="Ace of hearts, playable" style="width: 76px; height: 112px; box-sizing: border-box; padding: 9px; border-radius: 12px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 0 0 0 4px #FFB199, 4px 4px 0 4px #06302A; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; color: #D63A25; transform: translateY(-14px); font: inherit; cursor: pointer">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 36px; font-weight: 800; line-height: 0.9">A</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 21C5 15 2 11.5 2 7.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 10 1.8C22 11.5 19 15 12 21Z"/></svg>
      </button>
      <button aria-label="Ten of hearts, playable" style="width: 76px; height: 112px; box-sizing: border-box; padding: 9px; border-radius: 12px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 0 0 0 4px #FFB199, 4px 4px 0 4px #06302A; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; color: #D63A25; transform: translateY(-14px); font: inherit; cursor: pointer">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 36px; font-weight: 800; line-height: 0.9">10</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 21C5 15 2 11.5 2 7.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 10 1.8C22 11.5 19 15 12 21Z"/></svg>
      </button>
      <button disabled aria-label="Queen of spades, not playable" style="width: 76px; height: 112px; box-sizing: border-box; padding: 9px; border-radius: 12px; background: #C9D6D3; border: 3px solid #10201D; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; color: #10201D; opacity: 0.6; font: inherit">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 36px; font-weight: 800; line-height: 0.9">Q</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 2C8 7 3 10 3 14.5A4.5 4.5 0 0 0 11 17.4L9.5 22h5L13 17.4A4.5 4.5 0 0 0 21 14.5C21 10 16 7 12 2Z"/></svg>
      </button>
      <button disabled aria-label="Eight of clubs, not playable" style="width: 76px; height: 112px; box-sizing: border-box; padding: 9px; border-radius: 12px; background: #C9D6D3; border: 3px solid #10201D; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; color: #10201D; opacity: 0.6; font: inherit">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 36px; font-weight: 800; line-height: 0.9">8</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><circle cx="12" cy="7" r="4.2"/><circle cx="6.5" cy="14" r="4.2"/><circle cx="17.5" cy="14" r="4.2"/><path d="M10 22h4l-1.2-6h-1.6Z"/></svg>
      </button>
      <button disabled aria-label="King of diamonds, not playable" style="width: 76px; height: 112px; box-sizing: border-box; padding: 9px; border-radius: 12px; background: #C9D6D3; border: 3px solid #10201D; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; color: #A82314; opacity: 0.6; font: inherit">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 36px; font-weight: 800; line-height: 0.9">K</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 2 20 12 12 22 4 12Z"/></svg>
      </button>
      <button disabled aria-label="Seven of diamonds, not playable" style="width: 76px; height: 112px; box-sizing: border-box; padding: 9px; border-radius: 12px; background: #C9D6D3; border: 3px solid #10201D; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; color: #A82314; opacity: 0.6; font: inherit">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 36px; font-weight: 800; line-height: 0.9">7</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 2 20 12 12 22 4 12Z"/></svg>
      </button>
    </div>
  </section>

  <aside style="flex: 1 1 320px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px; padding: 32px 28px; background: #FFFFFF; color: #10201D; border-radius: 30px 0 0 30px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; line-height: 1.1">Your turn</h1>
      <span style="font-size: 15px; font-weight: 500; color: #51635F">Follow hearts</span>
      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0 0">
        <div style="flex-grow: 1; height: 8px; border-radius: 999px; background: #E4ECEA; display: flex" aria-hidden="true">
          <div style="width: 60%; border-radius: 999px; background: #D63A25"></div>
        </div>
        <span style="font-size: 16px; font-weight: 800; color: #B32C1A" aria-label="9 seconds left">0:09</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #51635F">Tokens · first to 10</h2>
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 48px; font-size: 15px; font-weight: 700">Us</span>
        <div style="flex-grow: 1; height: 8px; border-radius: 999px; background: #E4ECEA; display: flex" aria-label="4 of 10 tokens">
          <div style="width: 40%; border-radius: 999px; background: #0E4A41"></div>
        </div>
        <span style="width: 20px; text-align: right; font-size: 20px; font-weight: 800; line-height: 1">4</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 48px; font-size: 15px; font-weight: 700; color: #51635F">Them</span>
        <div style="flex-grow: 1; height: 8px; border-radius: 999px; background: #E4ECEA; display: flex" aria-label="6 of 10 tokens">
          <div style="width: 60%; border-radius: 999px; background: #D63A25"></div>
        </div>
        <span style="width: 20px; text-align: right; font-size: 20px; font-weight: 800; line-height: 1; color: #51635F">6</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #51635F">Players</h2>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
        <li style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 14px; background: #0E4A41; color: #FFFFFF">
          <span style="font-size: 15px; font-weight: 700">Ruwan (you)</span>
          <span style="font-size: 13px; font-weight: 700">to play</span>
        </li>
        <li style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 14px; background: #EEF3F2">
          <span style="font-size: 15px; font-weight: 700">Nimal</span>
          <span style="font-size: 13px; font-weight: 600; color: #51635F">partner</span>
        </li>
        <li style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 14px; background: #EEF3F2">
          <span style="font-size: 15px; font-weight: 700">Kamala</span>
          <span style="font-size: 13px; font-weight: 600; color: #51635F">dealer</span>
        </li>
        <li style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 14px; background: #FDEDE9">
          <span style="font-size: 15px; font-weight: 700">Sunil</span>
          <span style="font-size: 13px; font-weight: 700; color: #B32C1A">away · bot in 0:41</span>
        </li>
      </ul>
    </div>

    <div style="flex-grow: 1"></div>
    <button style="height: 48px; border: 2px solid #C9D6D3; border-radius: 14px; background: #FFFFFF; color: #10201D; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Leave match</button>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
