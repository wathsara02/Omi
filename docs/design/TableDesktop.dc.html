<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Omi table on desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#0C5A4F}a:hover{color:#083C35}
@keyframes seat-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,177,153,0.55)}50%{box-shadow:0 0 0 12px rgba(255,177,153,0)}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none !important}}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; background: #0E4A41; color: #FFFFFF; font-family: 'Manrope', 'Noto Sans Sinhala', 'Segoe UI', sans-serif">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 28px clamp(20px, 4vw, 48px) 12px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 44px; font-size: 15px; font-weight: 700">Us</span>
        <div style="width: 180px; height: 8px; border-radius: 999px; background: #0A3832; display: flex" aria-label="4 of 10 tokens">
          <div style="width: 40%; border-radius: 999px; background: #FFFFFF"></div>
        </div>
        <span style="font-size: 18px; font-weight: 800">4</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 44px; font-size: 15px; font-weight: 700; color: #C4E3DC">Them</span>
        <div style="width: 180px; height: 8px; border-radius: 999px; background: #0A3832; display: flex" aria-label="6 of 10 tokens">
          <div style="width: 60%; border-radius: 999px; background: #FFB199"></div>
        </div>
        <span style="font-size: 18px; font-weight: 800; color: #FFD9CC">6</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: #FFB199; color: #10201D">
      <span style="font-size: 14px; font-weight: 800">Trump</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-label="spades"><path d="M12 2C8 7 3 10 3 14.5A4.5 4.5 0 0 0 11 17.4L9.5 22h5L13 17.4A4.5 4.5 0 0 0 21 14.5C21 10 16 7 12 2Z"/></svg>
    </div>
  </header>

  <main style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: auto minmax(124px, auto) auto minmax(124px, auto); align-content: space-evenly; align-items: center; justify-items: center; gap: 8px; padding: 8px clamp(20px, 4vw, 48px) 28px">

    <span></span>
    <div style="display: flex; align-items: center; gap: 14px">
      <div class="pulse" style="position: relative; width: 68px; height: 68px; flex: none; border-radius: 50%; animation: seat-pulse 1.6s ease-in-out infinite" aria-label="Nimal, to play">
        <svg width="68" height="68" viewBox="0 0 68 68" style="position: absolute; inset: 0; transform: rotate(-90deg)" aria-hidden="true">
          <circle cx="34" cy="34" r="31" fill="none" stroke="#0A3832" stroke-width="5"/>
          <circle cx="34" cy="34" r="31" fill="none" stroke="#FFB199" stroke-width="5" stroke-linecap="round" stroke-dasharray="146 194.8"/>
        </svg>
        <span style="position: absolute; inset: 8px; border-radius: 50%; background: #FFFFFF; color: #10201D; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800">N</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 700">Nimal</span>
        <span style="font-size: 13px; font-weight: 600; color: #C4E3DC">partner · 6 cards</span>
      </div>
    </div>
    <span></span>

    <span></span>
    <span></span>
    <span></span>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span style="width: 52px; height: 52px; border-radius: 50%; background: #FFFFFF; color: #10201D; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800">K</span>
      <span style="font-size: 16px; font-weight: 700">Kamala</span>
      <span style="font-size: 13px; font-weight: 600; color: #C4E3DC">dealer · 6 cards</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #C4E3DC">Tricks</span>
      <span style="font-size: 36px; font-weight: 800; line-height: 1">2 – 1</span>
    </div>
    <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap; justify-content: center">
      <div aria-label="Nine of hearts, led by Sunil" style="width: 76px; height: 108px; box-sizing: border-box; padding: 9px; border-radius: 12px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 4px 4px 0 #06302A; display: flex; flex-direction: column; justify-content: space-between; color: #D63A25; transform: rotate(-5deg)">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 36px; font-weight: 800; line-height: 0.9">9</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 21C5 15 2 11.5 2 7.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 10 1.8C22 11.5 19 15 12 21Z"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <span style="width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; background: #0A3832; color: #C4E3DC; border: 2px dashed #C4E3DC; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800">S</span>
        <span style="font-size: 16px; font-weight: 700">Sunil</span>
        <span style="font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #0A3832; color: #FFD9CC">away 0:41</span>
      </div>
    </div>

    <span></span>
    <span></span>
    <span></span>
  </main>

  <footer style="display: flex; align-items: center; justify-content: center; gap: clamp(20px, 4vw, 56px); flex-wrap: wrap; padding: 26px clamp(20px, 4vw, 48px) 30px; background: #FFFFFF; color: #10201D; border-radius: 30px 30px 0 0">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 56px; height: 56px; flex: none; border-radius: 50%; background: #0E4A41; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800">R</span>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 17px; font-weight: 800; line-height: 1.1">You</span>
        <span style="font-size: 14px; font-weight: 500; color: #51635F">Nimal’s turn</span>
      </div>
    </div>

    <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap">
      <div aria-label="Ace of hearts" style="width: 76px; height: 108px; box-sizing: border-box; padding: 9px; border-radius: 12px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 4px 4px 0 #10201D; display: flex; flex-direction: column; justify-content: space-between; color: #D63A25">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 36px; font-weight: 800; line-height: 0.9">A</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 21C5 15 2 11.5 2 7.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 10 1.8C22 11.5 19 15 12 21Z"/></svg>
      </div>
      <div aria-label="Ten of hearts" style="width: 76px; height: 108px; box-sizing: border-box; padding: 9px; border-radius: 12px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 4px 4px 0 #10201D; display: flex; flex-direction: column; justify-content: space-between; color: #D63A25">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 36px; font-weight: 800; line-height: 0.9">10</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 21C5 15 2 11.5 2 7.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 10 1.8C22 11.5 19 15 12 21Z"/></svg>
      </div>
      <div aria-label="Queen of spades" style="width: 76px; height: 108px; box-sizing: border-box; padding: 9px; border-radius: 12px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 4px 4px 0 #10201D; display: flex; flex-direction: column; justify-content: space-between; color: #10201D">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 36px; font-weight: 800; line-height: 0.9">Q</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 2C8 7 3 10 3 14.5A4.5 4.5 0 0 0 11 17.4L9.5 22h5L13 17.4A4.5 4.5 0 0 0 21 14.5C21 10 16 7 12 2Z"/></svg>
      </div>
      <div aria-label="Eight of clubs" style="width: 76px; height: 108px; box-sizing: border-box; padding: 9px; border-radius: 12px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 4px 4px 0 #10201D; display: flex; flex-direction: column; justify-content: space-between; color: #10201D">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 36px; font-weight: 800; line-height: 0.9">8</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><circle cx="12" cy="7" r="4.2"/><circle cx="6.5" cy="14" r="4.2"/><circle cx="17.5" cy="14" r="4.2"/><path d="M10 22h4l-1.2-6h-1.6Z"/></svg>
      </div>
      <div aria-label="King of diamonds" style="width: 76px; height: 108px; box-sizing: border-box; padding: 9px; border-radius: 12px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 4px 4px 0 #10201D; display: flex; flex-direction: column; justify-content: space-between; color: #D63A25">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 36px; font-weight: 800; line-height: 0.9">K</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 2 20 12 12 22 4 12Z"/></svg>
      </div>
      <div aria-label="Seven of diamonds" style="width: 76px; height: 108px; box-sizing: border-box; padding: 9px; border-radius: 12px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 4px 4px 0 #10201D; display: flex; flex-direction: column; justify-content: space-between; color: #D63A25">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 36px; font-weight: 800; line-height: 0.9">7</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 2 20 12 12 22 4 12Z"/></svg>
      </div>
    </div>

    <button style="height: 48px; padding: 0 22px; border: 2px solid #C9D6D3; border-radius: 14px; background: #FFFFFF; color: #10201D; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Leave match</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
