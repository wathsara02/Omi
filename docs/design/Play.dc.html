<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Omi your turn</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gemunu+Libre:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#0C5A4F}a:hover{color:#083C35}
@keyframes turn-pulse{0%,100%{box-shadow:0 0 0 0 rgba(14,74,65,0.35)}50%{box-shadow:0 0 0 9px rgba(14,74,65,0)}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0E4A41; color: #FFFFFF; font-family: 'Manrope', 'Noto Sans Sinhala', 'Segoe UI', sans-serif">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 18px 10px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 38px; font-size: 13px; font-weight: 700">Us</span>
        <div style="width: 110px; height: 6px; border-radius: 999px; background: #0A3832; display: flex" aria-label="4 of 10 tokens">
          <div style="width: 40%; border-radius: 999px; background: #FFFFFF"></div>
        </div>
        <span style="font-size: 15px; font-weight: 800">4</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 38px; font-size: 13px; font-weight: 700; color: #C4E3DC">Them</span>
        <div style="width: 110px; height: 6px; border-radius: 999px; background: #0A3832; display: flex" aria-label="6 of 10 tokens">
          <div style="width: 60%; border-radius: 999px; background: #FFB199"></div>
        </div>
        <span style="font-size: 15px; font-weight: 800; color: #FFD9CC">6</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #FFB199; color: #10201D">
      <span style="font-size: 12px; font-weight: 800">Trump</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-label="spades"><path d="M12 2C8 7 3 10 3 14.5A4.5 4.5 0 0 0 11 17.4L9.5 22h5L13 17.4A4.5 4.5 0 0 0 21 14.5C21 10 16 7 12 2Z"/></svg>
    </div>
  </header>

  <main style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); align-items: center; justify-items: center; gap: 4px; padding: 8px 14px 30px">

    <span></span>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #10201D; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800">N</span>
      <span style="font-size: 13px; font-weight: 700">Nimal</span>
      <span style="font-size: 11px; font-weight: 600; color: #C4E3DC">partner</span>
    </div>
    <span></span>

    <span></span>
    <div aria-label="King of hearts, played by Nimal" style="width: 60px; height: 86px; box-sizing: border-box; padding: 7px; border-radius: 10px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 3px 3px 0 #06302A; display: flex; flex-direction: column; justify-content: space-between; color: #D63A25; transform: rotate(-3deg)">
      <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 28px; font-weight: 800; line-height: 0.9">K</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 21C5 15 2 11.5 2 7.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 10 1.8C22 11.5 19 15 12 21Z"/></svg>
    </div>
    <span></span>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
      <div aria-label="Jack of hearts, played by Kamala" style="width: 60px; height: 86px; box-sizing: border-box; padding: 7px; border-radius: 10px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 3px 3px 0 #06302A; display: flex; flex-direction: column; justify-content: space-between; color: #D63A25; transform: rotate(4deg)">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 28px; font-weight: 800; line-height: 0.9">J</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 21C5 15 2 11.5 2 7.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 10 1.8C22 11.5 19 15 12 21Z"/></svg>
      </div>
      <span style="font-size: 13px; font-weight: 700">Kamala</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #C4E3DC">Tricks</span>
      <span style="font-size: 24px; font-weight: 800; line-height: 1">2 – 1</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
      <div aria-label="Nine of hearts, led by Sunil" style="width: 60px; height: 86px; box-sizing: border-box; padding: 7px; border-radius: 10px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 3px 3px 0 #06302A; display: flex; flex-direction: column; justify-content: space-between; color: #D63A25; transform: rotate(-5deg)">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 28px; font-weight: 800; line-height: 0.9">9</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 21C5 15 2 11.5 2 7.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 10 1.8C22 11.5 19 15 12 21Z"/></svg>
      </div>
      <span style="font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #0A3832; color: #FFD9CC">Sunil · away 0:41</span>
    </div>

    <span></span>
    <div style="width: 60px; height: 86px; box-sizing: border-box; border-radius: 10px; border: 2px dashed #FFB199; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 700; line-height: 1.25; color: #FFD9CC">Your card</div>
    <span></span>
  </main>

  <footer style="position: relative; display: flex; flex-direction: column; gap: 22px; padding: 30px 16px 28px; background: #FFFFFF; color: #10201D; border-radius: 30px 30px 0 0">
    <div style="position: absolute; top: -18px; left: 50%; transform: translateX(-50%); padding: 6px 18px; border-radius: 999px; background: #FFB199; color: #10201D; border: 3px solid #10201D; box-shadow: 3px 3px 0 #10201D; font-size: 14px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap">Your turn</div>

    <div style="display: flex; align-items: center; gap: 14px">
      <div class="pulse" style="position: relative; width: 56px; height: 56px; flex: none; border-radius: 50%; animation: turn-pulse 1.6s ease-in-out infinite" aria-label="You, 9 seconds left">
        <svg width="56" height="56" viewBox="0 0 56 56" style="position: absolute; inset: 0; transform: rotate(-90deg)" aria-hidden="true">
          <circle cx="28" cy="28" r="25" fill="none" stroke="#E4ECEA" stroke-width="5"/>
          <circle cx="28" cy="28" r="25" fill="none" stroke="#0E4A41" stroke-width="5" stroke-linecap="round" stroke-dasharray="94.2 157.1"/>
        </svg>
        <span style="position: absolute; inset: 7px; border-radius: 50%; background: #0E4A41; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800">9</span>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 17px; font-weight: 800; line-height: 1.1">You</span>
        <span style="font-size: 13px; font-weight: 500; color: #51635F">Follow hearts</span>
      </div>
    </div>

    <div style="display: flex; justify-content: center; gap: 6px">
      <button aria-label="Ace of hearts, playable" style="width: 54px; height: 88px; box-sizing: border-box; padding: 6px; border-radius: 10px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 3px 3px 0 #10201D; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; color: #D63A25; transform: translateY(-12px); font: inherit; cursor: pointer">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 28px; font-weight: 800; line-height: 0.9">A</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 21C5 15 2 11.5 2 7.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 10 1.8C22 11.5 19 15 12 21Z"/></svg>
      </button>
      <button aria-label="Ten of hearts, playable" style="width: 54px; height: 88px; box-sizing: border-box; padding: 6px; border-radius: 10px; background: #FFFFFF; border: 3px solid #10201D; box-shadow: 3px 3px 0 #10201D; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; color: #D63A25; transform: translateY(-12px); font: inherit; cursor: pointer">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 28px; font-weight: 800; line-height: 0.9">10</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 21C5 15 2 11.5 2 7.8A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 10 1.8C22 11.5 19 15 12 21Z"/></svg>
      </button>
      <button disabled aria-label="Queen of spades, not playable" style="width: 54px; height: 88px; box-sizing: border-box; padding: 6px; border-radius: 10px; background: #EEF3F2; border: 3px solid #7E918D; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; color: #10201D; opacity: 0.6; font: inherit">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 28px; font-weight: 800; line-height: 0.9">Q</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 2C8 7 3 10 3 14.5A4.5 4.5 0 0 0 11 17.4L9.5 22h5L13 17.4A4.5 4.5 0 0 0 21 14.5C21 10 16 7 12 2Z"/></svg>
      </button>
      <button disabled aria-label="Eight of clubs, not playable" style="width: 54px; height: 88px; box-sizing: border-box; padding: 6px; border-radius: 10px; background: #EEF3F2; border: 3px solid #7E918D; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; color: #10201D; opacity: 0.6; font: inherit">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 28px; font-weight: 800; line-height: 0.9">8</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><circle cx="12" cy="7" r="4.2"/><circle cx="6.5" cy="14" r="4.2"/><circle cx="17.5" cy="14" r="4.2"/><path d="M10 22h4l-1.2-6h-1.6Z"/></svg>
      </button>
      <button disabled aria-label="King of diamonds, not playable" style="width: 54px; height: 88px; box-sizing: border-box; padding: 6px; border-radius: 10px; background: #EEF3F2; border: 3px solid #7E918D; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; color: #B32C1A; opacity: 0.6; font: inherit">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 28px; font-weight: 800; line-height: 0.9">K</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 2 20 12 12 22 4 12Z"/></svg>
      </button>
      <button disabled aria-label="Seven of diamonds, not playable" style="width: 54px; height: 88px; box-sizing: border-box; padding: 6px; border-radius: 10px; background: #EEF3F2; border: 3px solid #7E918D; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; color: #B32C1A; opacity: 0.6; font: inherit">
        <span style="font-family: 'Gemunu Libre', 'Arial Narrow', sans-serif; font-size: 28px; font-weight: 800; line-height: 0.9">7</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="align-self: flex-end" aria-hidden="true"><path d="M12 2 20 12 12 22 4 12Z"/></svg>
      </button>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

return {};
}
}
</script>
</body>
</html>
